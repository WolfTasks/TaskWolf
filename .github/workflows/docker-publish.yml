name: Publish to Docker Hub

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write   # cosign keyless via OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: ./backend
            image: kwolfgang/taskowolf-backend
            gradle_build: true
          - context: ./frontend
            image: kwolfgang/taskowolf-frontend
            gradle_build: false

    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a   # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Set up JDK 25
        if: matrix.gradle_build
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78   # v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build backend JAR
        if: matrix.gradle_build
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew bootJar

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1   # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550   # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302   # v6.2.0
        id: meta
        with:
          images: ${{ matrix.image }}
          tags: |
            # Derive the image tag from the git tag verbatim, stripping the
            # leading "v" (e.g. v1.0.03 -> 1.0.03). type=semver is NOT usable
            # here: the project's release convention uses a leading-zero patch
            # (v1.0.0x), which is invalid semver, so type=semver silently
            # produced an empty tag and only `latest` was ever pushed.
            type=match,pattern=v(.*),group=1
            type=raw,value=latest

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        id: build
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532   # v4.1.3

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
