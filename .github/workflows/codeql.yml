name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1'   # wöchentlich Mo 03:30 UTC

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43   # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1              # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad            # v5
        if: matrix.language == 'java-kotlin'
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370     # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          ram: 8192
      - name: Build backend for CodeQL
        if: matrix.language == 'java-kotlin'
        run: |
          chmod +x gradlew
          ./gradlew compileTestKotlin -x test --no-daemon
        working-directory: backend
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
