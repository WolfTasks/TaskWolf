spring:
  # Local PostgreSQL: `docker compose -f docker-compose.dev.yml up -d db`. The migrations are
  # PostgreSQL-only (gen_random_uuid(), jsonb), so there is no in-memory H2 fallback (B7).
  datasource:
    url: ${TW_DB_URL:jdbc:postgresql://localhost:5432/taskowolf}
    username: ${TW_DB_USER:taskowolf}
    password: ${TW_DB_PASS:taskowolf}
  jpa:
    show-sql: false

logging:
  level:
    com.taskowolf: DEBUG

taskowolf:
  jwt:
    secret: ${TW_JWT_SECRET:dev-secret-change-in-production-min-256-bits}
  allowed-origins: "http://localhost:*"

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
